<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
<title id="t">RewardAudit</title>
<desc id="d">Test the checker before you train on it. Five replies to a task whose reference answer is 34, with the score a checker gave each: a hedged answer, a wrong sign and a rewritten right answer are scored wrong.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1e"/><stop offset="1" stop-color="#111a2f"/></linearGradient>
  <radialGradient id="glowA" cx="230" cy="175" r="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#14b8a6" stop-opacity=".2"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowB" cx="820" cy="20" r="320" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#818cf8" stop-opacity=".18"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".55"/><stop offset=".5" stop-color="#334155" stop-opacity=".6"/><stop offset="1" stop-color="#818cf8" stop-opacity=".5"/></linearGradient>
  <linearGradient id="word" x1="290" y1="0" x2="452" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#2dd4bf"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
  <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#334155" fill-opacity=".55"/></pattern>
</defs>
<style>
  .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', SFMono-Regular, ui-monospace, Menlo, Consolas, 'Liberation Mono', monospace; }
  .scan { animation: scan 6s cubic-bezier(.6,0,.4,1) infinite; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 8% { opacity: 1; } 70% { transform: translateY(120px); opacity: 1; } 80%, 100% { transform: translateY(120px); opacity: 0; } }
  @keyframes blink { 50% { fill-opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="960" height="360" rx="20" fill="url(#bg)"/>
<rect width="960" height="360" rx="20" fill="url(#dots)"/>
<rect width="960" height="360" rx="20" fill="url(#glowA)"/>
<rect width="960" height="360" rx="20" fill="url(#glowB)"/>
<rect x=".75" y=".75" width="958.5" height="358.5" rx="19.25" fill="none" stroke="url(#border)" stroke-width="1.5"/>

<text x="48" y="80" class="mono" font-size="14" fill="#64748b">$ pip install rewardaudit<tspan class="cursor" fill="#2dd4bf"> ▍</tspan></text>
<g transform="translate(48 108)">
  <rect x="1" y="1" width="58" height="58" rx="15" fill="#0b1222" stroke="url(#mark)" stroke-width="2"/>
  <circle cx="27" cy="27" r="13.5" fill="none" stroke="url(#mark)" stroke-width="3.6"/>
  <path d="M21 27.6l4.3 4.3 7.8-8.4" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M37.4 37.4l8.6 8.6" stroke="url(#mark)" stroke-width="4.6" stroke-linecap="round"/>
</g>
<text x="124" y="156" class="sans" font-size="52" letter-spacing="-1.2"><tspan fill="#e2e8f0" font-weight="600">Reward</tspan><tspan fill="url(#word)" font-weight="800">Audit</tspan></text>
<text x="48" y="212" class="sans" font-size="20" font-weight="500" fill="#cbd5e1">Test the checker before you train on it.</text>
<text x="48" y="241" class="sans" font-size="15" fill="#94a3b8">A black-box audit for reward functions and verifiers.</text>
<g class="mono" font-size="12.5" text-anchor="middle">
  <rect x="48" y="266" width="86" height="28" rx="14" fill="#0b1222" stroke="#334155"/><text x="91" y="284.5" fill="#cbd5e1">no model</text>
  <rect x="144" y="266" width="72" height="28" rx="14" fill="#0b1222" stroke="#334155"/><text x="180" y="284.5" fill="#cbd5e1">no GPU</text>
  <rect x="226" y="266" width="94" height="28" rx="14" fill="#0b1222" stroke="#334155"/><text x="273" y="284.5" fill="#cbd5e1">79 probes</text>
</g>

<rect x="490" y="36" width="430" height="290" rx="14" fill="#070b16" fill-opacity=".82" stroke="#1e293b"/>
<circle cx="510" cy="58" r="5" fill="#fb7185" fill-opacity=".85"/><circle cx="527" cy="58" r="5" fill="#fbbf24" fill-opacity=".85"/><circle cx="544" cy="58" r="5" fill="#34d399" fill-opacity=".85"/>
<text x="716" y="62" class="mono" font-size="12" text-anchor="middle" fill="#64748b">reference answer: <tspan fill="#e2e8f0">34</tspan></text>
<path d="M490 76h430" stroke="#1e293b"/>
<g class="mono" font-size="10.5" fill="#64748b" letter-spacing="1.2">
  <text x="512" y="101">REPLY SENT</text><text x="768" y="101">TRUTH</text><text x="874" y="101" text-anchor="end">SCORE</text>
</g>
<rect class="scan" x="494" y="111" width="422" height="27" rx="6" fill="#22d3ee" fill-opacity=".07" stroke="#22d3ee" stroke-opacity=".35"/>
  <g>
    <text x="512" y="130" class="mono" font-size="12.5" fill="#e2e8f0">\boxed{34}</text>
    <text x="768" y="130" class="mono" font-size="12.5" fill="#94a3b8">right</text>
    <text x="874" y="130" class="mono" font-size="12.5" text-anchor="end" fill="#e2e8f0" font-weight="400">1.0</text>
    <g transform="translate(900 125.5)"><g><path d="M-5 0.5l3.4 3.4 6.6-7.2" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  </g>
  <g><rect x="498" y="141" width="414" height="27" rx="6" fill="#fb7185" fill-opacity=".1"/><rect x="498" y="141" width="3" height="27" rx="1.5" fill="#fb7185"/>
    <text x="512" y="160" class="mono" font-size="12.5" fill="#e2e8f0">The answer is either 68 or 34.</text>
    <text x="768" y="160" class="mono" font-size="12.5" fill="#94a3b8">hedged</text>
    <text x="874" y="160" class="mono" font-size="12.5" text-anchor="end" fill="#fb7185" font-weight="700">1.0</text>
    <g transform="translate(900 155.5)"><g><path d="M-4.2-4.2l8.4 8.4M4.2-4.2l-8.4 8.4" fill="none" stroke="#fb7185" stroke-width="2.4" stroke-linecap="round"/></g></g>
  </g>
  <g><rect x="498" y="171" width="414" height="27" rx="6" fill="#fb7185" fill-opacity=".1"/><rect x="498" y="171" width="3" height="27" rx="1.5" fill="#fb7185"/>
    <text x="512" y="190" class="mono" font-size="12.5" fill="#e2e8f0">\boxed{−34}</text>
    <text x="768" y="190" class="mono" font-size="12.5" fill="#94a3b8">wrong</text>
    <text x="874" y="190" class="mono" font-size="12.5" text-anchor="end" fill="#fb7185" font-weight="700">1.0</text>
    <g transform="translate(900 185.5)"><g><path d="M-4.2-4.2l8.4 8.4M4.2-4.2l-8.4 8.4" fill="none" stroke="#fb7185" stroke-width="2.4" stroke-linecap="round"/></g></g>
  </g>
  <g><rect x="498" y="201" width="414" height="27" rx="6" fill="#fbbf24" fill-opacity=".1"/><rect x="498" y="201" width="3" height="27" rx="1.5" fill="#fbbf24"/>
    <text x="512" y="220" class="mono" font-size="12.5" fill="#e2e8f0">\boxed{34.0}</text>
    <text x="768" y="220" class="mono" font-size="12.5" fill="#94a3b8">right</text>
    <text x="874" y="220" class="mono" font-size="12.5" text-anchor="end" fill="#fbbf24" font-weight="700">0.0</text>
    <g transform="translate(900 215.5)"><g><path d="M-4.2-4.2l8.4 8.4M4.2-4.2l-8.4 8.4" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linecap="round"/></g></g>
  </g>
  <g>
    <text x="512" y="250" class="mono" font-size="12.5" fill="#64748b">(empty reply)</text>
    <text x="768" y="250" class="mono" font-size="12.5" fill="#94a3b8">no answer</text>
    <text x="874" y="250" class="mono" font-size="12.5" text-anchor="end" fill="#e2e8f0" font-weight="400">0.0</text>
    <g transform="translate(900 245.5)"><g><path d="M-5 0.5l3.4 3.4 6.6-7.2" fill="none" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></g></g>
  </g>
<g>
  <path d="M490 276h430" stroke="#1e293b"/>
  <text x="512" y="303" class="mono" font-size="12.5" fill="#e2e8f0"><tspan fill="#fb7185" font-weight="700">3 of 5</tspan> replies scored wrong</text>
  <g class="mono" font-size="11" fill="#94a3b8">
    <circle cx="768" cy="299" r="4" fill="#fb7185"/><text x="777" y="303">accepted</text>
    <circle cx="848" cy="299" r="4" fill="#fbbf24"/><text x="857" y="303">rejected</text>
  </g>
</g>
</svg>
