name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python ${{ matrix.python }}
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check src tests examples
      - run: .venv/bin/python -m pytest -q

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/ruff check src tests examples
      - run: .venv/bin/python -m pytest -q

  no-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12
      - run: uv pip install -e . pytest
      - run: .venv/bin/python -m pytest -q

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"
      - run: uv venv --python 3.12 "$RUNNER_TEMP/wheel-venv"
      - run: uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" "$RUNNER_TEMP"/dist/*.whl
      - run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-venv/bin/rewardaudit" --version
          audit_status=0
          "$RUNNER_TEMP/wheel-venv/bin/rewardaudit" audit "$GITHUB_WORKSPACE/examples/quickstart/reward.py" --dataset "$GITHUB_WORKSPACE/examples/quickstart/data.jsonl" --out "$RUNNER_TEMP/out" || audit_status=$?
          test "$audit_status" -eq 1
          "$RUNNER_TEMP/wheel-venv/bin/rewardaudit" demo
          "$RUNNER_TEMP/wheel-venv/bin/python" "$GITHUB_WORKSPACE/examples/python_api.py"
          audit_status=0
          "$RUNNER_TEMP/wheel-venv/bin/rewardaudit" audit "$GITHUB_WORKSPACE/examples/verl/reward.py" --dataset "$GITHUB_WORKSPACE/examples/verl/data.jsonl" --n all || audit_status=$?
          test "$audit_status" -eq 1
          audit_status=0
          "$RUNNER_TEMP/wheel-venv/bin/rewardaudit" audit "$GITHUB_WORKSPACE/examples/trl/reward.py" --dataset "$GITHUB_WORKSPACE/examples/trl/data.jsonl" --n all || audit_status=$?
          test "$audit_status" -eq 1
          "$RUNNER_TEMP/wheel-venv/bin/rewardaudit" audit "$GITHUB_WORKSPACE/examples/qa/reward.py" --dataset "$GITHUB_WORKSPACE/examples/qa/data.jsonl" --n all --answer-col answers.text.0 --reference-col answers.text --answer-field
